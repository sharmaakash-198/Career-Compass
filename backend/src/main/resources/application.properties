# =========================
# Server Configuration
# =========================
server.port=8080

# =========================
# CORS (frontend origin)
# =========================
app.cors.allowed-origins=http://localhost:5000,http://127.0.0.1:5000,http://localhost:5173,http://127.0.0.1:5173

# Database config
#spring.datasource.url=jdbc:postgresql://localhost:5432/authdb
#spring.datasource.username=${DB_USERNAME:postgres}
#spring.datasource.password=1234

# =========================
# Database config - Supabase
# =========================

spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Encryption config
app.encryption.secret-key=${ENCRYPTION_SECRET_KEY}
app.encryption.phone-hash-key=${PHONE_HASH_KEY}

# Memcached config
app.memcached.host=localhost
app.memcached.port=11211


##
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=5
#spring.datasource.hikari.connection-timeout=30000

# Login config
logging.level.root=INFO
logging.level.com.authentication.AuthProject=DEBUG

# Redis config
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT config
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# NVIDIA API config
nvidia.api-key=${API_KEY}
nvidia.model=nvidia/llama-3.3-nemotron-super-49b-v1.5
nvidia.base-url=https://integrate.api.nvidia.com/v1
# Lower max_tokens = faster responses. For speed, try a smaller model e.g. meta/llama-3.1-8b-instruct
nvidia.max-tokens=2048
nvidia.read-timeout-ms=120000